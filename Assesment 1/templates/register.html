{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<h1>Create an account</h1>
<form method="post">
  <label>Name<input name="name" placeholder="Name" required></label>
  <label>Email<input name="email" type="email" placeholder="Email" required></label>
  <label>Password<input name="password" type="password" placeholder="Password" required></label>
  <button type="submit">Register</button>
</form>
<p>Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
{% endblock %}
